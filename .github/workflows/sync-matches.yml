name: Sync Match Results

on:
  schedule:
    # Every 10 min during FIFA 2026 match window (14:00-23:59 UTC)
    - cron: '*/10 14-23 * * *'
    # Every 60 min outside match window (00:00-13:59 UTC)
    - cron: '0 0-13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync today matches
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 25)
          echo "HTTP $HTTP_CODE"
          cat /tmp/sync_response.json
          [ "$HTTP_CODE" = "200" ] || exit 1
